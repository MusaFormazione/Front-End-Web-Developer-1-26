<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale prodotti</title>
  <link rel="stylesheet" href="style.css">
  <!-- Prima avvia il backend (npm start nella cartella backend).
       Per provare la soluzione: cambia script.js in soluzione.js -->
  <script src="script.js" defer></script>
</head>
<body>

  <header class="testata">
    <h1>Gestionale prodotti</h1>
  </header>

  <main class="layout">

    <section class="pannello">
      <h2 id="titolo-form">Nuovo prodotto</h2>

      <form id="form-prodotto">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" required>

        <label for="descrizione">Descrizione</label>
        <textarea id="descrizione" name="descrizione" rows="3"></textarea>

        <label for="prezzo">Prezzo (€)</label>
        <input id="prezzo" name="prezzo" type="number" min="0" step="0.01" required>

        <label for="foto">Foto</label>
        <input id="foto" name="foto" type="file" accept="image/*">
        <p id="nota-foto" class="piccolo" hidden>Lascia vuoto per tenere la foto attuale.</p>

        <div class="bottoni">
          <button type="submit" id="salva">Aggiungi</button>
          <button type="button" id="annulla" class="secondario">Cancella</button>
        </div>
      </form>

      <p id="messaggio" class="messaggio" role="status"></p>
    </section>

    <section>
      <h2>Prodotti</h2>
      <p id="stato" class="stato">Caricamento…</p>
      <ul id="lista" class="lista"></ul>
    </section>

  </main>

</body>
</html>
